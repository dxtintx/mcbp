name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - web
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Firebase Config Files
        run: |
          echo '{"projects":{"default":"mcbp-architect"}}' > .firebaserc
          echo '{"hosting":{"public":"out","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' > firebase.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Build Next.js Static Export
        run: |
          npm ci
          npm run build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MCBLUEPRINT_89101 }}'
          channelId: live
          projectId: mcbp-architect

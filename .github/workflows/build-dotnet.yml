name: Build & Package .NET MCBlueprint Desktop & Web Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-all:
    name: Build Desktop Apps, NSIS Installer & macOS/Linux Web Releases
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout web branch for macOS/Linux releases
        uses: actions/checkout@v4
        with:
          ref: web
          path: web_src

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bake Commit Hash into GitVersion.cs
        shell: powershell
        run: |
          $hash = git rev-parse --short HEAD
          "namespace MCBp; public static class GitVersion { public const string CommitHash = `"$hash`"; }" | Out-File -FilePath GitVersion.cs -Encoding utf8
          echo "SHORT_SHA=$hash" >> $env:GITHUB_ENV

      - name: Publish Windows x64 Portable
        run: dotnet publish MCBp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish_win64

      - name: Publish Windows x86 Portable
        run: dotnet publish MCBp.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o publish_win86

      - name: Publish Windows ARM64 Portable
        run: dotnet publish MCBp.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o publish_win_arm64

      - name: Build macOS & Linux Web App Release Packages
        shell: powershell
        run: |
          cd web_src
          npm ci
          npm run build
          cd out
          Compress-Archive -Path * -DestinationPath ..\..\MCBlueprint_Web_macOS.zip
          Compress-Archive -Path * -DestinationPath ..\..\MCBlueprint_Web_Linux.zip
          cd ..\..

      - name: Setup NSIS & Build Windows Installer
        shell: powershell
        run: |
          choco install nsis -y
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Create Zip Archives for Windows
        shell: powershell
        run: |
          Compress-Archive -Path publish_win64\* -DestinationPath MCBlueprint_Portable_Win64.zip
          Compress-Archive -Path publish_win86\* -DestinationPath MCBlueprint_Portable_Win32.zip
          Compress-Archive -Path publish_win_arm64\* -DestinationPath MCBlueprint_Portable_Win_ARM64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCBlueprint-Desktop-and-Web-Builds
          path: |
            MCBlueprint_Installer_Win64.exe
            MCBlueprint_Portable_Win64.zip
            MCBlueprint_Portable_Win32.zip
            MCBlueprint_Portable_Win_ARM64.zip
            MCBlueprint_Web_macOS.zip
            MCBlueprint_Web_Linux.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: ${{ github.ref_name == 'main' && format('v1.0.{0} ({1})', github.run_number, env.SHORT_SHA) || format('{0} ({1})', github.ref_name, env.SHORT_SHA) }}
          draft: false
          prerelease: false
          files: |
            MCBlueprint_Installer_Win64.exe
            MCBlueprint_Portable_Win64.zip
            MCBlueprint_Portable_Win32.zip
            MCBlueprint_Portable_Win_ARM64.zip
            MCBlueprint_Web_macOS.zip
            MCBlueprint_Web_Linux.zip
